name: Java CI/CD Pipelines


on:
  push:
    branches: ["feature/cicd-pipelines"]
  pull_request:
    branches: ["develop"]

jobs:

#----------Stage 1: Build----------
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'maven'

        - name: Build with Maven
          run: ./mvnw -B package --file pom.xml

        - name: Create Application Artifact
          uses: actions/upload-artifact@v4
          with:
            name: java-app-artifact
            path: target/*.jar


#----------Stage 2: Test----------
  test:
      runs-on: ubuntu-latest
      needs: build
  
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'maven'
          
        - name: Run Tests and Generate Log File
          if: always()
          run: |
                mkdir -p test_step/test_reports/
                mvn test > test_step/test_reports/pipeline_log.txt 2>&1

        - name: Upload Test Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-reports
            path: test_step/test_reports/

#----------Stage 3: Docker Build & Push----------
    docker:
       runs-on: ubuntu-latest
       needs: tests
       steps:
       
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Set Up Docker Build
         uses: docker/setup-buildx-action@v3
         
       - name: Log into DockerHub
         uses: docker/login-action@v3
         with: 
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_TOKEN }}
           
       - name: Builds Image and Push
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: ${{ secrets.DOCKER_USERNAME }}/my-image:latest
       

#----------Stage 4: Container Scanning----------


