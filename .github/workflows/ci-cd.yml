name: Java CI/CD Pipelines


on:
  push:
    branches: ["feature/cicd-pipelines"]
  pull_request:
    branches: ["develop"]

jobs:

#----------Stage 1: Build----------
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'maven'

        - name: Build with Maven
          run: ./mvnw -B package --file pom.xml

        - name: Create Application Artifact
          uses: actions/upload-artifact@v4
          with:
            name: java-app-artifact
            path: target/*.jar


#----------Stage 2: Test----------
  test:
      runs-on: ubuntu-latest
      needs: build
  
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'maven'
          
        - name: Run Tests and Generate Log File
          if: always()
          run: |
                mkdir -p test_step/test_reports/
                mvn test > test_step/test_reports/pipeline_log.txt 2>&1
        - name: Upload Test Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-reports
            path: test_step/test_reports/

#----------Stage 3: Docker Build & Push----------
  docker:
       runs-on: ubuntu-latest
       needs: test
       steps:
       
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Set Up Docker Build
         uses: docker/setup-buildx-action@v3
         
       - name: Log into DockerHub
         uses: docker/login-action@v3
         with: 
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_TOKEN }}
           
       - name: Builds Image and Push
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: |
             ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:latest
             ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:${{ github.sha }}
       

#----------Stage 4: Container Scanning----------
  scan:
      runs-on: ubuntu-latest
      needs: docker

      steps:
       - name: Scan Docker Image with Trivy
         uses: aquasecurity/trivy-action@0.20.0
         with:
           image-ref: ${{ secrets.DOCKER_USERNAME }}/spring-petclinic:latest
           format: table
           output: trivy-report.json
           exit-code: 0
           ignore-unfixed: true
           vuln-type: os,library
           severity: CRITICAL, HIGH
           scanners: vuln
           
       - name: Upload Scan Report
         uses:  actions/upload-artifact@v4
         with:
            name: trivy-security-report
            path: trivy-report.json

#----------Stage 5: Deploy to AWS ECS----------
  deploy:
    runs-on: ubuntu-latest
    needs: scan

    steps:

      - name: Configure the AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: ECS Service Deployment
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment
      - name: Verify the Deployment
        run: |
          aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --services ${{ secrets.ECS_SERVICE_NAME }}

#----------Stage 6: Performance Testing----------

#----------Stage 7: Pipeline Alerts----------
  alert:
    runs-on: ubuntu-latest
    if: always()
    needs: [build, test, docker, scan, deploy]
  
    steps:
      - name: Set pipeline status
        id: set_status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status_text= Huzzah! The pipeline hath succeed!" >> $GITHUB_OUTPUT
            echo "status_color=green" >> $GITHUB_OUTPUT
          else
            echo "status_text=💀 Alas! The pipeline hath failed!" >> $GITHUB_OUTPUT
            echo "status_color=red" >> $GITHUB_OUTPUT
          fi
  
      - name: Send Teams message
        uses: tlolkema/simple-teams-message@main
        with:
          webhook: ${{ secrets.TEAMS_WEBHOOK }}
          json_payload: |
            {
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
      
                      {
                        "type": "Container",
                        "style": "emphasis",
                        "bleed": true,
                        "items": [
                          {
                            "type": "TextBlock",
                            "text": "CI/CD Pipeline Report",
                            "weight": "Bolder",
                            "size": "Large"
                          },
                          {
                            "type": "TextBlock",
                            "text": "${{ github.workflow }}",
                            "spacing": "None",
                            "isSubtle": true
                          }
                        ]
                      },
      
                      {
                        "type": "Container",
                        "items": [
                          {
                            "type": "ColumnSet",
                            "columns": [
                              {
                                "type": "Column",
                                "width": "stretch",
                                "items": [
                                  {
                                    "type": "TextBlock",
                                    "text": "Repository",
                                    "weight": "Bolder"
                                  },
                                  {
                                    "type": "TextBlock",
                                    "text": "${{ github.repository }}",
                                    "wrap": true
                                  }
                                ]
                              },
                              {
                                "type": "Column",
                                "width": "stretch",
                                "items": [
                                  {
                                    "type": "TextBlock",
                                    "text": "Branch",
                                    "weight": "Bolder"
                                  },
                                  {
                                    "type": "TextBlock",
                                    "text": "${{ github.ref_name }}",
                                    "wrap": true
                                  }
                                ]
                              }
                            ]
                          },
      
                          {
                            "type": "ColumnSet",
                            "spacing": "Medium",
                            "columns": [
                              {
                                "type": "Column",
                                "width": "stretch",
                                "items": [
                                  {
                                    "type": "TextBlock",
                                    "text": "Actor",
                                    "weight": "Bolder"
                                  },
                                  {
                                    "type": "TextBlock",
                                    "text": "${{ github.actor }}"
                                  }
                                ]
                              },
                              {
                                "type": "Column",
                                "width": "stretch",
                                "items": [
                                  {
                                    "type": "TextBlock",
                                    "text": "Status",
                                    "weight": "Bolder"
                                  },
                                  {
                                    "type": "TextBlock",
                                    "text": "${{ steps.set_status.outputs.status_text }}",
                                    "color": "${{ steps.set_status.outputs.status_color == 'green' && 'Good' || 'Attention' }}",
                                    "weight": "Bolder"
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      },
      
                      {
                        "type": "Container",
                        "spacing": "Medium",
                        "items": [
                          {
                            "type": "TextBlock",
                            "text": "Stage Results",
                            "weight": "Bolder",
                            "size": "Medium"
                          },
      
                          {
                            "type": "ColumnSet",
                            "columns": [
                              {
                                "type": "Column",
                                "width": "stretch",
                                "items": [
                                  { "type": "TextBlock", "text": "Build: ${{ needs.build.result }}" },
                                  { "type": "TextBlock", "text": "Test: ${{ needs.test.result }}" },
                                  { "type": "TextBlock", "text": "Docker: ${{ needs.docker.result }}" }
                                ]
                              },
                              {
                                "type": "Column",
                                "width": "stretch",
                                "items": [
                                  { "type": "TextBlock", "text": "Scan: ${{ needs.scan.result }}" },
                                  { "type": "TextBlock", "text": "Deploy: ${{ needs.deploy.result }}" }
                                ]
                              }
                            ]
                          }
                        ]
                      }
      
                    ],
      
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "🔎 View Logs",
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }
                    ]
                  }
                }
              ]
            }
